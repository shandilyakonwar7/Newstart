<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e6;
            overflow: hidden; /* Prevents scrollbars when button moves */
        }
        h1 { 
            color: #ff4d6d; 
            font-size: 2.5rem; 
            text-align: center;
            padding: 20px;
        }
        .buttons { 
            display: flex; 
            gap: 30px; 
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #yesBtn { 
            background-color: #ff4d6d; 
            color: white; 
            z-index: 1; /* Keeps Yes button on top */
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute; /* Allows it to move anywhere */
            transition: 0.1s; /* Makes the jump look smoother */
        }
    </style>
</head>
<body>

    <h1>Will you be my Valentine? ❤️</h1>
    
    <div class="buttons">
        <button id="yesBtn" onclick="alert('Yay! I knew you would say yes! 🥰')">Yes</button>
        
        <button id="noBtn" style="left: 60%; top: 50%;">No</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        const moveButton = () => {
            // This math keeps the button inside the visible phone screen
            const padding = 50;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - (padding * 2)) + padding;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - (padding * 2)) + padding;
            
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        };

        // Triggers the move when the mouse/finger gets close
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton); // Helps it work on touchscreens
        noBtn.addEventListener('click', moveButton); // Just in case they are fast!
    </script>

</body>
</html>
