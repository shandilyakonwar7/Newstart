<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e6;
            overflow: hidden;
        }
        h1 { color: #ff4d6d; text-align: center; margin-bottom: 30px; }
        
        /* This box keeps them side-by-side at the start */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            height: 50px;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        
        #noBtn { 
            background-color: #adb5bd; 
            color: white;
            z-index: 999; /* Ensures it stays visible when moving */
        }
    </style>
</head>
<body>

    <h1>Will you be my Valentine? ❤️</h1>
    
    <div class="container">
        <button id="yesBtn" onclick="alert('Yay! See you on the 14th! 🥰')">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        const moveButton = () => {
            // Once touched, the button becomes 'absolute' and jumps away
            noBtn.style.position = 'absolute';
            
            // Keeps the button within the phone screen boundaries
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        };

        // Listen for both mouse hover and mobile touch
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // This is the magic line for mobile!
            moveButton();
        });
    </script>

</body>
</html>
