<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffe6e6; /* Light pink background */
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Keeps everything clean */
        }

        h1 { 
            color: #ff4d6d; 
            text-align: center; 
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .container { 
            display: flex; 
            gap: 20px; 
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #yesBtn { 
            background-color: #ff4d6d; 
            color: white; 
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        #noBtn { 
            background-color: #adb5bd; 
            color: white; 
            position: relative; /* Starts in the row */
            z-index: 999;
        }
    </style>
</head>
<body>

    <h1 id="question">Will you be my Valentine? ❤️</h1>
    
    <div id="buttonContainer" class="container">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const buttonContainer = document.getElementById('buttonContainer');

        const moveButton = () => {
            // Switch to fixed so it can fly over everything
            noBtn.style.position = 'fixed'; 
            
            // Safety margin (pixels)
            const padding = 20; 
            
            // Calculate random spots while keeping the button fully visible
            const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.floor(Math.random() * (maxWidth - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxHeight - padding)) + padding;
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };

        // Desktop escape
        noBtn.addEventListener('mouseover', moveButton);
        
        // Mobile escape
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents the click from landing
            moveButton();
        });

        // The Success Moment
        yesBtn.addEventListener('click', () => {
            question.innerHTML = "Yay! See you on the 14th! 🥰";
            buttonContainer.style.display = 'none'; // Hide the Yes button
            noBtn.style.display = 'none'; // Hide the No button
            
            // Launch Confetti
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#ffafcc', '#ffffff']
            });
        });
    </script>
</body>
</html>
